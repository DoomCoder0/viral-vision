<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox | Viral Vision</title><style>
:root{font:15px Inter,system-ui,sans-serif;color:#ecf3ff;background:#080d18}*{box-sizing:border-box}main{max-width:1000px;margin:8vh auto;padding:20px}h1{font-size:clamp(28px,5vw,46px);letter-spacing:-.05em}h1 span{color:#32d6d5}p{color:#9aabc8}a{color:#47cde9}.card{background:#111b2d;border:1px solid #273959;border-radius:14px;padding:20px;margin:14px 0}header{display:flex;justify-content:space-between;align-items:center}small{color:#8b9dba}.goal{white-space:pre-wrap;line-height:1.6}button{background:linear-gradient(90deg,#347bf9,#27cfc9);padding:10px 18px;border:0;border-radius:30px;color:white;cursor:pointer}
</style></head><body><main><header><a href="/">← Website</a><button id="refresh">Refresh inbox</button></header><h1>Viral <span>Vision</span> / Inbox</h1><p>Protected inquiries. Set <code>ADMIN_PASSWORD</code> on your server to enable access.</p><div id="inbox" aria-live="polite">Loading…</div></main><script>
async function load(){const el=document.getElementById('inbox');el.textContent='Loading…';try{const r=await fetch('/api/inquiries',{cache:'no-store'});if(!r.ok)throw new Error('Access denied');const {items}=await r.json();el.replaceChildren();if(!items.length){el.textContent='No inquiries yet.';return;}items.forEach(v=>{const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=v.name+' — '+v.email;const d=document.createElement('small');d.textContent=v.received_at+' • '+v.reference;const p=document.createElement('p');p.className='goal';p.textContent=v.goal;card.append(h,d,p);el.append(card);});}catch(e){el.textContent=e.message;}}
document.getElementById('refresh').addEventListener('click',load);load();</script></body></html>
